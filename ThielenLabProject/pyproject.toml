[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minnelove-emu"
version = "0.1.0"
description = "Local proof-of-concept interface and pipeline helpers for MINNELOVE long-read microbiome analysis with Emu."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.22",
  "scikit-learn>=1.4",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
minnelove = "minnelove_emu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minnelove_emu"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "*.ipynb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
